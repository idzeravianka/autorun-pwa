<ion-content>
  <ion-list class="devices-list-wrapper">
    @for (entity of allUserSettings()?.savedEntities; track entity.id) {
      <ion-item class="device-list-item">
        <ion-label>{{ entity.name }}</ion-label>
        <ion-button fill="clear" (click)="navigateTo('settings/connection?entityId=' + entity.id)">
          <ion-icon name="create-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" (click)="showConfirmationDialog(entity)">
          <ion-icon name="trash-outline" color="danger"></ion-icon>
        </ion-button>
      </ion-item>
    }

    <ion-button (click)="navigateTo('settings/connection')">
      <ion-icon name="add-circle-outline"></ion-icon>
      <span class="add-new-device-label">Добавить устройство</span>
    </ion-button>
  </ion-list>
</ion-content>
